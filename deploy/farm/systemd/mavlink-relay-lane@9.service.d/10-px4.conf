# Instance-specific override for lane 9 only (lanes 0-7 untouched: this
# drop-in dir only applies to mavlink-relay-lane@9, not the @.service
# template). The base template's After/Wants=sitl@%i.service is the AP unit
# name and does not exist for lane 9; point it at the PX4 chain instead
# (px4-mavbridge-lane@9 provides the tcpin this relay's --upstream reads).
[Unit]
After=
Wants=
After=network.target px4-mavbridge-lane@9.service
Wants=px4-mavbridge-lane@9.service
