# Lane 7 override (2026-08-20): second T6 lane, canonical campaign launch
# field home instead of the shared 8-lane default (which is 11 km south and
# would change the T6 nearest-hospital geometry). Base sitl@.service template
# is untouched; this drop-in only replaces ExecStart for instance 7.
[Service]
ExecStart=
ExecStart=/bin/bash -c 'source /home/dronepilot/venv-ardupilot/bin/activate && exec /home/dronepilot/ardupilot/Tools/autotest/sim_vehicle.py -v ArduCopter -I 7 -C -N --mavproxy-args="--daemon" --out=tcpin:127.0.0.1:5677 --custom-location=33.74349,-117.83288,41.3,0'
