# Instance-specific override for lane 8 only (lanes 0-7 untouched).
# Same reasoning as mavlink-relay-lane@8.service.d/10-px4.conf: the base
# template names the AP sitl@%i.service, which does not exist for lane 8.
[Unit]
After=
Wants=
After=network.target sitl-px4@8.service px4-mavbridge-lane@8.service mavlink-relay-lane@8.service
Wants=sitl-px4@8.service px4-mavbridge-lane@8.service mavlink-relay-lane@8.service
Requires=mavlink-relay-lane@8.service
