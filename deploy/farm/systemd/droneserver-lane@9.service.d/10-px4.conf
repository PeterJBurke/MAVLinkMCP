Wants=
After=network.target sitl-px4@9.service px4-mavbridge-lane@9.service mavlink-relay-lane@9.service
Wants=sitl-px4@9.service px4-mavbridge-lane@9.service mavlink-relay-lane@9.service
Requires=mavlink-relay-lane@9.service
