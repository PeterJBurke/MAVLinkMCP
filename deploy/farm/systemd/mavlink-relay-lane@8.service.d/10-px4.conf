# Instance-specific override for lane 8 only (lanes 0-7 untouched: this
# drop-in dir only applies to mavlink-relay-lane@8, not the @.service
# template). The base template's After/Wants=sitl@%i.service is the AP unit
# name and does not exist for lane 8; point it at the PX4 chain instead
# (px4-mavbridge-lane@8 provides the tcpin this relay's --upstream reads).
[Unit]
After=
Wants=
After=network.target px4-mavbridge-lane@8.service
Wants=px4-mavbridge-lane@8.service
