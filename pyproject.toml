[project]
name = "droneserver"
version = "2.0.0"
description = "MAVLink MCP Server - AI-powered drone control via Model Context Protocol"
authors = [
    {name = "Peter J Burke"},
    {name = "Ion Gabriel", email = "ion.ion.gabriel@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
# 3.11, not 3.10: the transport-cancellation discrimination in
# droneserver.llm.mcp_session (FIX 16) is built on asyncio.Task.cancelling()/
# uncancel(), which do not exist before 3.11, and the ~23 `except TimeoutError`
# telemetry handlers rely on asyncio.TimeoutError having been unified with the
# builtin - also 3.11. The old ">=3.10" was never true. See FIX 17.
requires-python = ">=3.11"
keywords = ["mavlink", "mcp", "drone", "uav", "llm", "mavsdk", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "httpx>=0.27.0",  # direct HTTP to model provider APIs (droneserver.llm)
    "mavsdk>=2.0.0",
    "mcp-agent>=0.1.0",
    "mcp-server>=0.1.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
droneserver = "droneserver.server:main"

[project.urls]
Homepage = "https://github.com/PeterJBurke/droneserver"
Repository = "https://github.com/PeterJBurke/droneserver"
"Original Repository" = "https://github.com/ion-g-ion/MAVLinkMCP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pymavlink>=2.4.40",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# sitl-marked integration tests are excluded by default (and in CI);
# run them explicitly: `uv run pytest -m sitl tests/integration`
addopts = "-v --tb=short -m 'not sitl and not longmission'"
markers = [
    "sitl: integration test requiring the local docker ArduPilot SITL (see tests/integration/README.md)",
    "longmission: >10-minute SITL demonstration mission (slow; excluded from default and CI runs) - see docs/long_mission_demo.md",
    "px4: requires a PX4 SITL - auto-skipped until llmuavpx4 exists; ArduPilot result recorded in docs/firmware_notes.csv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/droneserver"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E4", # pycodestyle imports
    "E7", # pycodestyle statements
    "E9", # pycodestyle runtime errors
    "F",  # pyflakes
    "I",  # isort
    "W",  # pycodestyle warnings
]

# (No per-file lint ignores: the v1 tool modules were fully rewritten to v2
# standards in Phase 2 - bare excepts and unused vars removed.)

[tool.mypy]
# Permissive baseline; per-module strictness will be ratcheted up module by
# module as the v2 refactor proceeds (Plan 01 Phase 6).
files = ["src/droneserver"]
# Matches requires-python. This is not a loosening to silence errors: at 3.10
# mypy correctly reported four real ones (Task.cancelling on a 3.10 stdlib),
# and the fix was to stop claiming a floor the code does not support.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_configs = true

# (No module ignore_errors overrides: the Phase 2 rewrite removed the
# fall-off-the-end telemetry handlers and int/float reassignments the v1 code
# carried, so the whole package type-checks cleanly.)
