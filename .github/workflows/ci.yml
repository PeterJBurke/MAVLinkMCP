name: CI

on:
  push:
    branches: [main, v2-upgrade]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]  # expand matrix (3.11-3.13) later in Phase 6
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Unit tests (no SITL)
        # NOTE: this figure is unit-only and is low by construction (~29%).
        # Most of the codebase is drone-tool bodies that can only run against a
        # simulator, so the meaningful coverage number is produced by the
        # nightly SITL workflow. No gate is set on this number deliberately -
        # a threshold on a figure that does not measure what it appears to
        # would be worse than none.
        run: uv run pytest --cov=src/droneserver --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          f = pathlib.Path("coverage.xml")
          if f.exists():
              rate = float(ET.parse(f).getroot().get("line-rate", 0)) * 100
              print(f"Line coverage: {rate:.1f}%")
              pathlib.Path("coverage-summary.txt").write_text(f"{rate:.1f}")
          PY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
